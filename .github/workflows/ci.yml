name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers peft datasets scikit-learn onnx onnxruntime huggingface_hub fastapi uvicorn laya Faker pytest httpx
      - run: pip install -e .
      - run: PYTHONPATH=src python -m pytest tests/ -q
      - run: PYTHONPATH=src python src/suraksha/train.py --config configs/g1_guard.json --seed 7 --device cpu --dry-run
